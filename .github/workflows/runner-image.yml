# Builds the sandbox runner image and pushes it to Vultr Container Registry (VKE pulls it from there).
# Repo secrets: VCR_REGISTRY (e.g. sjc.vultrcr.com/switchproof), VCR_USERNAME, VCR_PASSWORD
name: runner-image
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [shared/**, switchcore/**, rl/**, sandbox_host/Dockerfile.runner]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ secrets.VCR_REGISTRY }}
          username: ${{ secrets.VCR_USERNAME }}
          password: ${{ secrets.VCR_PASSWORD }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: sandbox_host/Dockerfile.runner
          push: true
          tags: |
            ${{ secrets.VCR_REGISTRY }}/switchproof-runner:latest
            ${{ secrets.VCR_REGISTRY }}/switchproof-runner:${{ github.sha }}
