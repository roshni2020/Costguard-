<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>SwitchProof · Migration mission control</title>
  <link rel="icon" href="data:,">
  <link rel="modulepreload" href="vendor/three.module.min.js">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="top">
    <div class="brand">
      <svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 3 6v6c0 5 3.8 9.4 9 10 5.2-.6 9-5 9-10V6l-9-4Z" fill="currentColor" opacity=".18"/><path d="M12 2 3 6v6c0 5 3.8 9.4 9 10 5.2-.6 9-5 9-10V6l-9-4Zm-1.2 14.2-3.5-3.5 1.4-1.4 2.1 2.1 4.9-4.9 1.4 1.4-6.3 6.3Z" fill="currentColor"/></svg>
      <span><b>SwitchProof</b><small>migration mission control</small></span>
    </div>
    <div id="badge" class="badge-live"></div>
    <div id="model"></div>
    <div id="me"></div>
    <details id="switcher" class="switcher">
      <summary id="sw-sum">Runs</summary>
      <div class="pop" id="runs"></div>
    </details>
    <button class="btn primary" data-act="new">+ New migration test</button>
  </header>
  <nav id="rail" class="secnav" aria-label="Sections"></nav>
  <div id="mode" class="mode" hidden></div>

  <!-- The one 3D scene. app.js moves it into the current page's .hero-slot, or parks it here (hidden = paused). -->
  <div id="hero-park" hidden>
    <section id="hero" class="hero3d" aria-label="Live switch view">
      <div id="scene" class="scene"></div>
      <div id="hero-fallback" class="hero-fallback" hidden></div>
      <div class="hero-overlay">
        <div id="hero-status" class="hero-status" role="status" aria-live="polite">Loading…</div>
        <div id="hero-sub" class="hero-sub"></div>
        <div id="hero-cta" class="hero-cta"></div>
      </div>
      <div class="hero-hint" aria-hidden="true">Card terminal → OLD A · OLD B · NEW · click a tower for evidence</div>
    </section>
  </div>

  <main id="main">
    <section class="sec page" id="sec-overview" data-sec="overview" aria-labelledby="h-overview" hidden><h2 class="sec-h sr" id="h-overview" tabindex="-1"><span class="n">◎</span>Overview</h2><div class="hero-slot"></div><div class="sec-body"></div></section>
    <section class="sec page" id="sec-rules" data-sec="rules" aria-labelledby="h-rules" hidden><h2 class="sec-h" id="h-rules" tabindex="-1"><span class="n">1</span>Rules</h2><div class="sec-body"></div></section>
    <section class="sec page" id="sec-review" data-sec="review" aria-labelledby="h-review" hidden><h2 class="sec-h" id="h-review" tabindex="-1"><span class="n">2</span>Approve</h2><div class="sec-body"></div></section>
    <section class="sec page" id="sec-run" data-sec="run" aria-labelledby="h-run" hidden><h2 class="sec-h" id="h-run" tabindex="-1"><span class="n">3</span>Run</h2><div class="hero-slot"></div><div class="sec-body"></div></section>
    <section class="sec page" id="sec-evidence" data-sec="evidence" aria-labelledby="h-evidence" hidden><h2 class="sec-h" id="h-evidence" tabindex="-1"><span class="n">4</span>Evidence</h2><div class="hero-slot"></div><div class="sec-body"></div></section>
    <section class="sec page" id="sec-decision" data-sec="decision" aria-labelledby="h-decision" hidden><h2 class="sec-h" id="h-decision" tabindex="-1"><span class="n">5</span>Decision</h2><div class="hero-slot"></div><div class="sec-body"></div></section>
    <section class="sec page" id="sec-agents" data-sec="agents" aria-labelledby="h-agents" hidden><h2 class="sec-h" id="h-agents" tabindex="-1"><span class="n">A</span>Agents</h2><div class="sec-body"></div></section>
    <section class="sec page" id="sec-infra" data-sec="infra" aria-labelledby="h-infra" hidden><h2 class="sec-h" id="h-infra" tabindex="-1"><span class="n">I</span>Infrastructure</h2><div class="sec-body"></div></section>
    <section class="sec page" id="sec-rl" data-sec="rl" aria-labelledby="h-rl" hidden><h2 class="sec-h" id="h-rl" tabindex="-1"><span class="n">R</span>RL explorer</h2><div class="sec-body"></div></section>
  </main>
  <div id="toasts" role="status" aria-live="polite"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
