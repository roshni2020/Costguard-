# Installs gVisor (runsc + containerd shim) on every VKE node and registers the `runsc` containerd runtime.
# VKE does not ship gVisor; this is the standard containerd integration (gvisor.dev/docs/user_guide/containerd).
# Idempotent: re-running changes nothing on nodes that are already set up. Remove with: kubectl delete ns gvisor-system
apiVersion: v1
kind: Namespace
metadata:
  name: gvisor-system
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: gvisor-installer
  namespace: gvisor-system
spec:
  selector:
    matchLabels: {app: gvisor-installer}
  template:
    metadata:
      labels: {app: gvisor-installer}
    spec:
      hostPID: true                  # needed to restart containerd on the node via nsenter
      tolerations: [{operator: Exists}]
      containers:
        - name: install
          image: alpine:3.20
          securityContext: {privileged: true}
          volumeMounts: [{name: host, mountPath: /host}]
          readinessProbe:
            exec: {command: [test, -f, /tmp/ready]}
            periodSeconds: 5
          command: [/bin/sh, -c]
          args:
            - |
              set -eu
              apk add --no-cache util-linux coreutils bzip2 tar >/dev/null
              ARCH=$(uname -m)
              # pinned release; gVisor now ships one archive (runsc + shim + gvisor-bin/ helpers), no "latest" alias
              REL=20260921
              URL=https://storage.googleapis.com/gvisor/releases/release/$REL/$ARCH
              if [ ! -x /host/usr/local/bin/runsc ] || [ ! -d /host/usr/local/bin/gvisor-bin ]; then
                cd /tmp
                wget -q "$URL/gvisor.tar.bz2" "$URL/gvisor.tar.bz2.sha512"
                sha512sum -c gvisor.tar.bz2.sha512
                tar -xjf gvisor.tar.bz2 -C /host/usr/local/bin
                echo "installed gVisor $REL: $(nsenter -t 1 -m -- /usr/local/bin/runsc --version | head -1)"
              fi
              # use the config the RUNNING containerd was started with (VKE: /opt/containerd/config.toml)
              HOSTCFG=$(nsenter -t 1 -m -p -- sh -c 'pgrep -a -x containerd' | sed -n 's/.*--config[ =]\([^ ]*\).*/\1/p' | head -1)
              HOSTCFG=${HOSTCFG:-/etc/containerd/config.toml}
              CFG=/host$HOSTCFG
              echo "containerd config: $HOSTCFG"
              if [ ! -s "$CFG" ]; then
                mkdir -p "$(dirname "$CFG")"
                nsenter -t 1 -m -- containerd config default > "$CFG"
              fi
              # containerd config v3+ (containerd 2.x; VKE ships v4) names the CRI runtime plugin differently than v2
              if grep -Eq '^version *= *([3-9]|[1-9][0-9])' "$CFG"; then
                KEY="io.containerd.cri.v1.runtime"
              else
                KEY="io.containerd.grpc.v1.cri"
              fi
              if ! grep -q "$KEY.*containerd.runtimes.runsc" "$CFG"; then
                sed -i '/containerd\.runtimes\.runsc\]/,+1d' "$CFG"      # drop a runsc block written under the wrong key
                printf '\n[plugins."%s".containerd.runtimes.runsc]\n  runtime_type = "io.containerd.runsc.v1"\n' "$KEY" >> "$CFG"
                echo "registered runsc under $KEY, restarting containerd"
                nsenter -t 1 -m -u -i -n -p -- systemctl restart containerd
              fi
              touch /tmp/ready
              echo "gvisor ready on $(cat /host/etc/hostname)"
              sleep infinity
      volumes:
        - name: host
          hostPath: {path: /}
