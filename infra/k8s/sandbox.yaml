# SwitchProof sandbox namespace on Vultr Kubernetes Engine.
# Every test batch = one Job here, under gVisor, with no network, no credentials, read-only root, then deleted.
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: gvisor
handler: runsc                       # installed on every node by gvisor-installer.yaml
---
apiVersion: v1
kind: Namespace
metadata:
  name: switchproof-sandbox
  labels:
    # the API server itself rejects any pod here that is not fully hardened
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
---
# Blast radius cap: even a runaway agent cannot use more than this.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: sandbox-quota
  namespace: switchproof-sandbox
spec:
  hard:
    pods: "20"
    limits.cpu: "16"
    limits.memory: 12Gi
    configmaps: "40"
---
# No network in or out for anything in this namespace (not even DNS).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-all
  namespace: switchproof-sandbox
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
# The control plane's identity: can start/read/delete sandboxes in this namespace and nothing else.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dispatcher
  namespace: switchproof-sandbox
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dispatcher
  namespace: switchproof-sandbox
rules:
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [create, get, delete]
  - apiGroups: ["batch"]
    resources: [jobs]
    verbs: [create, get, list, delete]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dispatcher
  namespace: switchproof-sandbox
subjects:
  - kind: ServiceAccount
    name: dispatcher
    namespace: switchproof-sandbox
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: dispatcher
---
# Read-only cluster view for the Infrastructure page (node list, RuntimeClass present?).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: switchproof-dispatcher-view
rules:
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get, list]
  - apiGroups: ["node.k8s.io"]
    resources: [runtimeclasses]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: switchproof-dispatcher-view
subjects:
  - kind: ServiceAccount
    name: dispatcher
    namespace: switchproof-sandbox
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: switchproof-dispatcher-view
---
apiVersion: v1
kind: Secret
metadata:
  name: dispatcher-token
  namespace: switchproof-sandbox
  annotations:
    kubernetes.io/service-account.name: dispatcher
type: kubernetes.io/service-account-token
